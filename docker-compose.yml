services:
  db:
    image: pgvector/pgvector:pg16
    container_name: autoops_pgvector
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: autoops_db
    ports:
     - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d autoops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
